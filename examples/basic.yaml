# Reads the Soldered Slider Potentiometer with Qwiic every 200 ms and publishes the slider position in percent
# (0 - 100 %) and the raw 10-bit ADC value (0 - 1023).

esphome:
  name: soldered-slider-pot-basic

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [soldered_slider_potentiometer]

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: soldered_slider_potentiometer
    address: 0x30
    update_interval: 200ms
    position:
      name: "Slider Position"
      filters:
        - delta: 1.0
    raw:
      name: "Slider Raw"
